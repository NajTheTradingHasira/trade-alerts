name: Pre-Market Movers Scan

on:
  schedule:
    # 8:30 AM ET = 12:30 UTC (EST) / 13:30 UTC (EDT)
    # Run at both times to cover DST transitions
    - cron: '30 12 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      min_change:
        description: 'Minimum % change threshold (default: 3)'
        required: false
        default: '3'

jobs:
  premarket-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy slack-sdk

      - name: Run pre-market screener
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS="--mode premarket --slack --config channel_config.json"
          if [ -n "${{ github.event.inputs.min_change }}" ] && [ "${{ github.event.inputs.min_change }}" != "3" ]; then
            ARGS="$ARGS --min-change ${{ github.event.inputs.min_change }}"
          fi
          python extended_hours_screener.py $ARGS

      - name: Upload CSV results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-results-${{ github.run_number }}
          path: '*.csv'
          retention-days: 30
          if-no-files-found: ignore
